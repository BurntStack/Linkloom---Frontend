<!doctype html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-KKJG6LRD"></script>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-PVS9W8P7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linkloom Brand Dashboard</title>
<meta name="description" content="Linkloom for brands: find creators, post jobs, hire with escrow, approve work and track spend.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Figtree:wght@400;500;600;700&family=Mynerve&display=swap">
</head>
<body data-motion-color="coral">
<a class="skip" href="#view" data-skip>Skip to content</a>
<div id="app" class="app">
  <aside class="side" aria-label="Main">
    <a class="sbox brand" href="#home" aria-label="Linkloom home"><img src="assets/logo-mark.svg" width="28" height="28" alt=""><span>linkloom</span></a>
    <div class="sbox nav-box">
      <nav class="nav" aria-label="Sections">
        <a href="#home" data-nav="home">Home</a>
        <a href="#creators" data-nav="creators">Find creators</a>
        <a href="#jobs" data-nav="jobs">Jobs</a>
        <a href="#campaigns" data-nav="campaigns">Campaigns</a>
        <a href="#payments" data-nav="payments">Payments</a>
        <a href="#reports" data-nav="reports">Reports</a>
        <a href="#messages" data-nav="messages">Messages <span class="badge" data-badge="messages" hidden></span></a>
      </nav>
      <p class="nav-note">Instagram · YouTube · English</p>
    </div>
    <a class="sbox slipbox" href="#payments">
      <span class="t-cap slip-l">Held in escrow</span>
      <span class="t-money t-money-m" data-side-held></span>
      <span class="pill pill-escrow" data-side-live></span>
      <span class="slip-plan" data-side-plan hidden></span>
    </a>
    <a class="sbox me" href="#profile" data-nav="profile"><span class="avatar" data-me-initials></span><span class="me-t"><b data-me-name></b><span data-me-handle></span></span></a>
  </aside>

  <div class="main">
    <header class="top">
      <a class="hbox hlogo" href="#home" aria-label="Linkloom home"><img src="assets/logo-mark.svg" width="26" height="26" alt=""><span>linkloom</span></a>
      <p class="hbox crumb" id="crumb" hidden></p>
      <div class="grow"></div>
      <div class="hbox icons">
        <a class="ibtn bell" href="#cart" id="cartBtn" aria-label="Hiring cart" data-ic="cart"><span class="bell-n" data-badge="cart" hidden></span></a>
        <a class="ibtn bell" href="#messages" id="inbox" aria-label="Messages" data-ic="chat"><span class="bell-n" data-badge="messages" hidden></span></a>
        <button class="ibtn bell" type="button" id="bell" aria-label="Notifications" data-ic="bell"><span class="bell-n" data-badge="bell" hidden></span></button>
        <a class="avatar" href="#profile" aria-label="Brand profile" data-me-initials></a>
      </div>
    </header>
    <main class="view light" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar dark" aria-label="Sections">
    <a href="#home" data-nav="home" data-ic="home">Home</a>
    <a href="#creators" data-nav="creators" data-ic="users">Creators</a>
    <a href="#jobs" data-nav="jobs" data-ic="brief">Jobs</a>
    <a href="#campaigns" data-nav="campaigns" data-ic="rail">Campaigns</a>
    <a href="#payments" data-nav="payments" data-ic="coin">Payments</a>
  </nav>
</div>
<div id="focusRoot" hidden></div>
<script type="module" src="/src/apps/brand/main.ts"></script>
</body>
</html>
