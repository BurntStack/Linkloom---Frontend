<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Linkloom Creator Dashboard</title>
<meta name="description" content="Linkloom for creators: find brand deals, bid, track work and get paid from escrow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Figtree:wght@400;500;600;700&family=Mynerve&display=swap">
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="screens/login.css"><link rel="stylesheet" href="screens/setup.css"><link rel="stylesheet" href="screens/kyc.css"><link rel="stylesheet" href="screens/profile.css">
<link rel="stylesheet" href="screens/home.css"><link rel="stylesheet" href="screens/jobs.css"><link rel="stylesheet" href="screens/job.css"><link rel="stylesheet" href="screens/bid.css"><link rel="stylesheet" href="screens/bids.css">
<link rel="stylesheet" href="screens/active.css"><link rel="stylesheet" href="screens/messages.css"><link rel="stylesheet" href="screens/earnings.css">

<a class="skip" href="#view" data-skip>Skip to content</a>
<div id="app" class="app">
  <aside class="side" aria-label="Main">
    <a class="sbox brand" href="#home" aria-label="Linkloom home"><img src="assets/logo-mark.svg" width="28" height="28" alt=""><span>linkloom</span></a>
    <div class="sbox nav-box">
      <nav class="nav" aria-label="Sections">
        <a href="#home" data-nav="home">Home</a>
        <a href="#jobs" data-nav="jobs">Find jobs</a>
        <a href="#bids" data-nav="bids">My bids</a>
        <a href="#active" data-nav="active">Active jobs</a>
        <a href="#earnings" data-nav="earnings">Earnings</a>
        <a href="#messages" data-nav="messages">Messages <span class="badge" data-badge="messages" hidden></span></a>
      </nav>
      <p class="nav-note">Instagram · YouTube · English</p>
    </div>
    <a class="sbox slipbox" href="#earnings">
      <span class="t-cap slip-l">Ready to withdraw</span>
      <span class="t-money t-money-m" data-side-ready></span>
      <span class="pill pill-escrow" data-side-escrow></span>
      <span class="slip-plan" data-side-plan hidden></span>
    </a>
    <a class="sbox me" href="#profile" data-nav="profile"><span class="avatar" data-me-initials></span><span class="me-t"><b data-me-name></b><span data-me-handle></span></span></a>
  </aside>

  <div class="main">
    <header class="top">
      <a class="hbox hlogo" href="#home" aria-label="Linkloom home"><img src="assets/logo-mark.svg" width="26" height="26" alt=""><span>linkloom</span></a>
      <p class="hbox clock" id="clock" aria-label="India time"></p>
      <p class="hbox crumb" id="crumb" hidden></p>
      <div class="grow"></div>
      <div class="hbox icons">
        <a class="ibtn bell" href="#messages" id="inbox" aria-label="Messages" data-ic="chat"><span class="bell-n" data-badge="messages" hidden></span></a>
        <button class="ibtn bell" type="button" id="bell" aria-label="Notifications" data-ic="bell"><span class="bell-n" data-badge="bell" hidden></span></button>
        <a class="avatar" href="#profile" aria-label="Your profile" data-me-initials></a>
      </div>
    </header>
    <main class="view light" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar dark" aria-label="Sections">
    <a href="#home" data-nav="home" data-ic="home">Home</a>
    <a href="#jobs" data-nav="jobs" data-ic="brief">Find jobs</a>
    <a href="#bids" data-nav="bids" data-ic="send">My bids</a>
    <a href="#active" data-nav="active" data-ic="rail">Active jobs</a>
    <a href="#earnings" data-nav="earnings" data-ic="coin">Earnings</a>
  </nav>
</div>
<div id="focusRoot" hidden></div>

<style>
.bell{position:relative}
.bell-n{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:var(--ll-coral);color:var(--ll-ink-text);font-size:11px;font-weight:700}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="ui-select.js"></script>
<script src="motion.js"></script>
<script src="screens/login.js"></script><script src="screens/setup.js"></script><script src="screens/kyc.js"></script><script src="screens/profile.js"></script>
<script src="screens/home.js"></script><script src="screens/jobs.js"></script><script src="screens/job.js"></script><script src="screens/bid.js"></script><script src="screens/bids.js"></script>
<script src="screens/active.js"></script><script src="screens/messages.js"></script><script src="screens/earnings.js"></script>
<script>window.LLD.boot();</script>

</body></html>
